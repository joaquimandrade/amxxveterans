<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Romanian Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; touch-action: none; user-select: none; -webkit-user-select: none; height: 100%; overflow: hidden; background: #0c0e18; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
      /* Arcade health bars: portrait, name and score above a yellow bar on red. */
      #bars { position: fixed; top: 12px; left: 14px; pointer-events: none; display: grid; gap: 10px; font-family: "Press Start 2P", ui-monospace, monospace; }
      .fighter { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: end; width: min(360px, calc(100vw - 28px)); }
      .fighter[hidden] { display: none; }
      .portrait { width: 56px; height: 56px; border: 3px solid #fff; outline: 2px solid #000; background: #222; image-rendering: auto; }
      .label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
      .label .score { color: #7cf2ff; }
      .enemy .label { color: #ffd23a; }
      .bar { position: relative; height: 16px; background: #301010; border: 2px solid #fff; outline: 2px solid #000; }
      .bar div { position: absolute; inset: 0 auto 0 0; height: 100%; }
      .bar .lag { background: #e02818; transition: width 0.6s ease 0.25s; }
      .bar .fill { background: linear-gradient(#fff6a0, #ffd200 45%, #e8a400); }
      #mana { height: 6px; margin-top: 4px; background: #1b2238; border: 2px solid #000; }
      #mana-fill { height: 100%; background: linear-gradient(#8ec0ff, #2a56c8); }
      body.cutscene #bars { display: none; }
      #talk { position: fixed; inset: 0; background: #000; }
      #talk[hidden] { display: none; }
      .talk-scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
      #talk-scene-tall { display: none; object-position: center top; }
      /* On a phone held upright: the tall painting, and a bigger dialogue box across the bottom. */
      @media (orientation: portrait) {
        #talk-scene { display: none; }
        #talk-scene-tall { display: block; }
        #talk-box { bottom: 0; width: 100vw; min-height: 36vh; grid-template-columns: 1fr; gap: 10px; padding: 18px 18px 34px; border-width: 3px 0 0; outline: none; }
        #talk-box > img { position: absolute; top: -52px; left: 18px; width: 96px; height: 96px; }
        #talk-name { margin: 0 0 12px 112px; font-size: 16px; }
        #talk-english { font-size: 21px; min-height: 4.2em; }
        #talk-romanian { font-size: 18px; }
        #talk-next { font-size: 12px; bottom: 12px; right: 18px; }
      }
      #talk-box {
        position: absolute; left: 50%; bottom: 4vh; transform: translateX(-50%); width: min(980px, calc(100vw - 24px));
        display: grid; grid-template-columns: auto 1fr; gap: 16px; padding: 14px; box-sizing: border-box;
        background: #0b0806e8; border: 3px solid #e8d7a8; outline: 3px solid #000; color: #fff4dc;
      }
      #talk-portrait { width: clamp(72px, 12vw, 120px); height: clamp(72px, 12vw, 120px); border: 3px solid #fff; outline: 2px solid #000; }
      #talk-name { font: 14px "Press Start 2P", monospace; color: #ffd23a; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; }
      #talk-english { font: 600 clamp(16px, 2.2vw, 22px)/1.4 Georgia, serif; min-height: 2.8em; }
      #talk-romanian { font: italic clamp(14px, 1.8vw, 18px)/1.4 Georgia, serif; color: #d9c48f; margin-top: 8px; min-height: 1.4em; }
      #talk-next { position: absolute; right: 12px; bottom: 8px; font: 10px "Press Start 2P", monospace; color: #e8d7a8; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      #banner { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
      #banner[hidden] { display: none; }
      #banner-text { font: clamp(36px, 9vw, 96px) "Press Start 2P", monospace; color: #ffd23a; text-shadow: 6px 6px 0 #b8200f, 10px 10px 0 #000; }
      #banner-hint { margin-top: 26px; font: 14px "Press Start 2P", monospace; color: #fff; text-shadow: 2px 2px 0 #000; animation: blink 1s steps(2) infinite; }
      #banner.pop #banner-text { animation: pop 0.35s ease-out; }
      @keyframes pop { from { transform: scale(2.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      #brand {
        position: fixed; right: 18px; bottom: 10px; pointer-events: none; color: #fff7e0; opacity: 0.42;
        font: 700 clamp(22px, 4vw, 40px)/1 "Cinzel Decorative", Georgia, serif; letter-spacing: 1px;
        text-shadow: 0 2px 6px #0008;
      }
      #panel {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px));
        padding: 18px; color: #3a2a18; background: #e6d3a8; border: 4px solid #6b4a24; border-radius: 6px;
        box-shadow: 0 10px 40px #000a; font: 15px/1.4 Georgia, serif;
      }
      #panel h2 { margin: 0 0 4px; font-size: 22px; }
      #panel p { margin: 0 0 12px; font-size: 14px; }
      #slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
      .slot { aspect-ratio: 1; padding: 6px; border: 2px solid #8a6a3a; border-radius: 4px; background: #d2bb8a; font: inherit; }
      .slot img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .slot.usable { cursor: pointer; }
      .slot.usable:hover, .slot.usable:focus { border-color: #2a56c8; }
      .slot.equipped { border-color: #c8501a; background: #e8c47a; box-shadow: inset 0 0 0 2px #c8501a; }
    </style>
  </head>
  <body class="cutscene">
    <div id="fade"></div>
    <div id="bars">
      <div class="fighter">
        <img class="portrait" id="hero-portrait" alt="" />
        <div>
          <div class="label"><span>VIRGILIU</span><span class="score" id="hero-score">000000</span></div>
          <div class="bar"><div class="lag" id="hero-lag"></div><div class="fill" id="hero-fill"></div></div>
          <div id="mana"><div id="mana-fill"></div></div>
        </div>
      </div>
      <div class="fighter enemy" id="enemy-bar" hidden>
        <img class="portrait" id="enemy-portrait" alt="" />
        <div>
          <div class="label"><span id="enemy-name"></span></div>
          <div class="bar"><div class="lag" id="enemy-lag"></div><div class="fill" id="enemy-fill"></div></div>
        </div>
      </div>
    </div>
    <div id="brand">Romanian Life</div>
    <section id="talk" hidden>
      <img class="talk-scene" id="talk-scene" alt="Virgiliu and the policeman on his donkey, face to face in the village" />
      <img class="talk-scene" id="talk-scene-tall" alt="Virgiliu and the policeman on his donkey, face to face in the village" />
      <div id="talk-box">
        <img id="talk-portrait" alt="" />
        <div>
          <div id="talk-name"></div>
          <div id="talk-english"></div>
          <div id="talk-romanian" lang="ro"></div>
        </div>
        <div id="talk-next">click ▸</div>
      </div>
    </section>
    <div id="banner" hidden><div id="banner-text"></div><div id="banner-hint"></div></div>
    <section id="panel" hidden>
      <h2>Inventory</h2>
      <p id="panel-hint">Click a weapon to equip it, or a potion to drink it. M closes.</p>
      <div id="slots"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
